services:
  - type: web
    name: clipforge-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ui
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      # Dockerfile EXPOSEs both 8501 (streamlit) and 8080 (api) - pin the
      # port explicitly per service so Render doesn't have to guess which.
      - key: PORT
        value: "8501"
      - key: DEMO_BUCKET
        sync: false
      - key: DEMO_DAILY_LIMIT
        value: "100"
      - key: DEMO_PER_IP_DAILY_LIMIT
        value: "10"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: clipforge-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_BUCKET
        sync: false
      - key: DEMO_DAILY_LIMIT
        value: "100"
      - key: DEMO_PER_IP_DAILY_LIMIT
        value: "10"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
