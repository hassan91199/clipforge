name: deploy

# Manual, approval-gated deploy of the demo (Streamlit) and API (FastAPI,
# CF-20) services to Google Cloud Run, built from the same image.
# Requires repo secrets/vars (set once with the GCP project owner):
#   - secrets.GCP_SA_KEY    JSON key for clipforge-deploy@clip-forge-508022...
#   - vars.GCP_PROJECT_ID   e.g. clip-forge-508022
#   - vars.GCP_REGION       e.g. us-central1
#   - vars.FRONTEND_ORIGIN  the Vercel frontend's origin, for CORS (CF-21)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Compute image tag
        run: echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push demo image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/clipforge-demo/clipforge
        run: |
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/clipforge-demo/clipforge
        run: |
          # --session-affinity pins a browser session to one instance - without it,
          # the request that fetches the generated video can land on a different
          # instance than the one that rendered it, 404ing an empty player.
          gcloud run deploy clipforge-demo \
            --image="$IMAGE:$TAG" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --session-affinity \
            --port=8501 \
            --command="docker-entrypoint.sh" \
            --args="ui" \
            --service-account="clipforge-demo-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars="DEMO_BUCKET=clipforge-demo-quota-508022"
          echo "url=$(gcloud run services describe clipforge-demo --region=${{ vars.GCP_REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke the deployed URL
        run: curl -fsS --max-time 60 "${{ steps.deploy.outputs.url }}/_stcore/health"

      - name: Deploy API to Cloud Run
        id: deploy-api
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/clipforge-demo/clipforge
        run: |
          # Same image as clipforge-demo above, just a different entrypoint mode -
          # the FastAPI backend (CF-20) that CF-21's Next.js frontend calls.
          gcloud run deploy clipforge-api \
            --image="$IMAGE:$TAG" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --session-affinity \
            --port=8080 \
            --command="docker-entrypoint.sh" \
            --args="api" \
            --service-account="clipforge-demo-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars="DEMO_BUCKET=clipforge-demo-quota-508022" \
            --update-env-vars="FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}"
          echo "url=$(gcloud run services describe clipforge-api --region=${{ vars.GCP_REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke the deployed API URL
        run: curl -fsS --max-time 60 "${{ steps.deploy-api.outputs.url }}/api/health"
